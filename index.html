<script>/* ===== Adaptador Supabase: la app habla con Supabase como si fuera la plataforma anterior ===== */
(function(){
 const C=window.GESTOR_CONFIG||{};
 window.__configured=!!(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&!/PEGAR/.test(C.SUPABASE_URL+C.SUPABASE_ANON_KEY));
 if(!window.__configured||!window.supabase)return;
 const sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.__sb=sb;
 const BUCKET='files',uuid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
 /* --- datos --- */
 const caches={};let chan=null,wasUp=false;
 const emit=(n,now)=>{const c=caches[n];if(!c||!c.loaded)return;clearTimeout(c.t);const go=()=>{const snap={docs:[...c.map].map(([id,d])=>({id,data:()=>d}))};c.subs.forEach(s=>{try{s.cb(snap)}catch(e){console.error(e)}})};if(now)go();else c.t=setTimeout(go,10)};
 async function load(n){const c=caches[n];let from=0;try{c.map.clear();for(;;){const{data,error}=await sb.from('docs').select('id,data').eq('col',n).order('id').range(from,from+999);if(error)throw error;data.forEach(r=>c.map.set(r.id,r.data));if(data.length<1000)break;from+=1000}}catch(e){c.subs.forEach(s=>s.err&&s.err(e))}c.loaded=true;emit(n)}
 function channel(){if(chan)return;chan=sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const r=p.eventType==='DELETE'?p.old:p.new;if(!r)return;const c=caches[r.col];if(!c)return;if(p.eventType==='DELETE')c.map.delete(r.id);else c.map.set(r.id,r.data);emit(r.col)}).subscribe(st=>{if(st==='SUBSCRIBED'){if(wasUp)Object.keys(caches).forEach(load);wasUp=true}})}
 const local=(n,f)=>{const c=caches[n];if(c){f(c.map);emit(n,true)}};
 const coll=n=>({
  async add(data){const id=uuid(),{error}=await sb.from('docs').insert({col:n,id,data});if(error)throw error;local(n,m=>m.set(id,data));return{id}},
  doc:id=>({async set(data){const{error}=await sb.from('docs').upsert({col:n,id,data});if(error)throw error;local(n,m=>m.set(id,data))},
   async delete(){const{data,error}=await sb.from('docs').delete().eq('col',n).eq('id',id).select('id');if(error)throw error;if(!data||!data.length)throw new Error('No tenés permiso para eliminar esto');local(n,m=>m.delete(id))}}),
  onSnapshot(cb,err){let c=caches[n];if(!c){c=caches[n]={map:new Map(),subs:[],loaded:false,t:0};channel();c.subs.push({cb,err});load(n);return}c.subs.push({cb,err});if(c.loaded)emit(n)}});
 /* --- archivos privados --- */
 const st=()=>sb.storage.from(BUCKET),sig={},q=[];let qt=0;
 const ASSETS={
  async upload(blob,o){const id=uuid(),{error}=await st().upload(id,blob,{contentType:(o&&o.type)||blob.type,upsert:false});if(error){const e=new Error(error.message||'No se pudo subir');e.code='upload_failed';throw e}return{id,url:'/_blob/'+id,sizeBytes:blob.size,contentType:(o&&o.type)||blob.type}},
  async delete(id){const{error}=await st().remove([id]);if(error)throw error;return{deleted:true}},
  async list(){const all=[];for(let off=0;;off+=1000){const{data,error}=await st().list('',{limit:1000,offset:off});if(error)throw error;all.push(...data.filter(x=>x.name&&x.id!==null||x.metadata));if(data.length<1000)break}
   const assets=all.map(x=>({id:x.name,sizeBytes:(x.metadata&&x.metadata.size)||0,contentType:(x.metadata&&x.metadata.mimetype)||'',createdAt:x.created_at||''}));
   return{assets,usage:{files:assets.length,bytes:assets.reduce((a,b)=>a+b.sizeBytes,0),maxFiles:C.MAX_FILES||50000,maxBytes:(C.STORAGE_MB||1024)*1048576}}}};
 function signed(id){const c=sig[id];if(c&&c.exp>Date.now())return c.p;return sig[id]={exp:Date.now()+50*60*1000,p:new Promise(r=>{q.push({id,r});clearTimeout(qt);qt=setTimeout(async()=>{const b=q.splice(0);try{const{data}=await st().createSignedUrls([...new Set(b.map(x=>x.id))],3600),m={};(data||[]).forEach(x=>{if(x.signedUrl)m[x.path]=x.signedUrl});b.forEach(x=>{if(!m[x.id])delete sig[x.id];x.r(m[x.id]||null)})}catch(e){b.forEach(x=>{delete sig[x.id];x.r(null)})}},25)})}.p}
 window.__blobUrl=async u=>{const s=String(u),i=s.indexOf('#'),id=s.slice(7,i<0?undefined:i),r=await signed(id);return r?r+(i<0?'':s.slice(i)):s};
 const fix=el=>{if(!el||el.nodeType!==1)return;const s=el.getAttribute('src');if(s&&s.startsWith('/_blob/')){el.setAttribute('src','data:,');window.__blobUrl(s).then(u=>{if(u&&u!==s)el.setAttribute('src',u)})}el.querySelectorAll&&el.querySelectorAll('[src^="/_blob/"]').forEach(fix)};
 new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='attributes')fix(m.target);else m.addedNodes.forEach(fix)})).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});
 /* --- descargas --- */
 const MIME={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',csv:'text/csv',json:'application/json',png:'image/png',pdf:'application/pdf'};
 const DL={async save({filename,data}){const ext=(filename.split('.').pop()||'').toLowerCase(),blob=data instanceof Blob?data:new Blob([data],{type:MIME[ext]||'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
 const USER={can:p=>p==='data.write'?(window.__anyWrite?window.__anyWrite():true):true,id:async()=>window.__uid||null};
 window.claude={use:async k=>({db:{collection:coll},assets:ASSETS,downloads:DL,user:USER}[k]||null)};
})();

const S={teams:[],seasons:[],members:[],att:[],tr:[],mt:[]},N={teams:'teams',seasons:'seasons',members:'members',att:'attendance',tr:'trainings',mt:'matches'};

try{sel=JSON.parse(localStorage.getItem('sel'))||sel}catch(e){}

const mine=k=>S[k].filter(x=>x.season===sel.season);
const fail=e=>{FAILED=1;$('#msg').textContent='No se pudo guardar: '+(e&&e.message||e)};
const add=(k,d)=>db.collection(N[k]).add(d).catch(fail);
const del=(k,id)=>{const b=event.target;if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='¿Seguro?';setTimeout(()=>{b.dataset.s='';b.textContent='Eliminar'},3000);return}trashDel(k,id)};
const val=id=>($('#'+id)||{}).value||'';

async function init(){
  const c=window.claude&&await claude.use('db');
  if(!c){$('#app').innerHTML='<div class="card">Abrí este enlace desde claude.ai con tu cuenta para ver los datos compartidos.</div>';return}
  db=c;
  const u=await claude.use('user');
  if(u&&u.can){const w=u.can('data.write');if(w===false){canW=false;$('#msg').textContent='Modo solo lectura: pedí permiso de Colaborador para editar.'}}
  Object.keys(N).forEach(k=>db.collection(N[k]).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},e=>fail(e)));
  $('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-t="${k}">${v}</button>`).join('');
  $('#nav').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;draw()}};
  draw();
}
function bar(){
  if(!sel.team&&S.teams[0])sel.team=S.teams[0].id;
  const ss=S.seasons.filter(s=>s.team===sel.team);
  if(!ss.some(s=>s.id===sel.season))sel.season=ss[0]?.id||'';
  $('#bar').innerHTML=`<select id="selT">${S.teams.map(t=>`<option value="${t.id}"${t.id===sel.team?' selected':''}>${esc(t.name)}</option>`).join('')||'<option>Sin equipos</option>'}</select>
  <select id="selS">${ss.map(s=>`<option value="${s.id}"${s.id===sel.season?' selected':''}>${esc(s.name)}</option>`).join('')||'<option>Sin temporadas</option>'}</select>`;
  $('#selT').onchange=e=>{sel.team=e.target.value;sel.season='';save();bar();refresh()};
  $('#selS').onchange=e=>{sel.season=e.target.value;save();refresh()};

}
const formHTML={
